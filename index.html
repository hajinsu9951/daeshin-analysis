                                    * **Flexible (유연한)**: 본교의 수시 경쟁력과 수능 최저 충족 가능자(전국 백분위 보정치 적용)를 합산한 수치입니다.
                                </div>
                            </div>
                        </section>

                        {/* 섹션 4: 전략 제언 */}
                        <section className="bg-indigo-950 rounded-[3rem] p-10 shadow-2xl relative overflow-hidden text-white">
                            <div className="absolute top-0 right-0 p-12 opacity-5 pointer-events-none"><Icon name="Target" size={400} /></div>
                            <div className="relative z-10">
                                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-10">
                                    <div className="flex items-center gap-5">
                                        <Icon name="Award" size={48} className="text-amber-400" />
                                        <h3 className="text-3xl font-black tracking-widest uppercase italic underline decoration-amber-400 decoration-4 underline-offset-8">Strategic Insight · {predLabel}</h3>
                                    </div>
                                    {availPredPeriods.length > 1 && (
                                        <div className="flex items-center gap-1 bg-white/10 p-1.5 rounded-2xl border border-white/15 shrink-0">
                                            {availPredPeriods.map(p => (
                                                <button key={p} onClick={() => setPredPeriod(p)} className={`px-5 py-2.5 rounded-xl text-sm font-black transition-all ${effPredPeriod === p ? 'bg-amber-400 text-indigo-950 shadow-md scale-105' : 'text-amber-200/70 hover:text-white'}`}>2026 {p}</button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                {insight && (
                                    <div className="mb-8 p-6 rounded-3xl bg-amber-400/10 border border-amber-300/30">
                                        <p className="text-[10px] font-black tracking-widest uppercase text-amber-300 mb-2">Head Teacher’s Diagnosis · 진학 전문교사 진단</p>
                                        <p className="text-base md:text-lg font-bold leading-relaxed">{insight.headline}</p>
                                    </div>
                                )}

                                {metricsRows.length > 0 && (
                                    <div className="mb-8">
                                        <h4 className="text-xs font-black tracking-widest uppercase text-indigo-200 mb-3">핵심 지표 · {predLabel}{prevKey ? ` (직전 ${prevKey} 대비)` : ''}</h4>
                                        <div className="overflow-x-auto rounded-2xl border border-white/15 bg-white/5">
                                            <table className="w-full text-sm tabular-nums">
                                                <thead>
                                                    <tr className="text-[11px] uppercase tracking-widest text-indigo-200/80 border-b border-white/10">
                                                        <th className="py-3 px-4 text-left font-black">영역</th>
                                                        <th className="py-3 px-4 text-center font-black">1등급</th>
                                                        <th className="py-3 px-4 text-center font-black">1~2등급 누적</th>
                                                        <th className="py-3 px-4 text-center font-black">1~3등급 누적</th>
                                                        <th className="py-3 px-4 text-center font-black">4~5등급</th>
                                                        <th className="py-3 px-4 text-center font-black">1~3등급 변화</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {metricsRows.map(({ sub, c, pv }) => {
                                                        const dN = pv ? c.n123 - pv.n123 : null;
                                                        const dP = pv ? c.p123 - pv.p123 : null;
                                                        const tone = dN == null ? 'text-indigo-200/60' : dN > 0 ? 'text-emerald-300' : dN < 0 ? 'text-rose-300' : 'text-indigo-200/60';
                                                        return (
                                                            <tr key={sub}>
                                                                <td className="py-3 px-4 font-black">{sub}</td>
                                                                <td className="py-3 px-4 text-center">{c.p1.toFixed(1)}% <span className="text-indigo-200/60 text-xs">({c.n1}명)</span></td>
                                                                <td className="py-3 px-4 text-center">{c.p12.toFixed(1)}% <span className="text-indigo-200/60 text-xs">({c.n12}명)</span></td>
                                                                <td className="py-3 px-4 text-center font-black">{c.p123.toFixed(1)}% <span className="text-indigo-200/60 text-xs font-bold">({c.n123}명)</span></td>
                                                                <td className="py-3 px-4 text-center">{c.p45.toFixed(1)}%</td>
                                                                <td className={`py-3 px-4 text-center font-black ${tone}`}>{dN == null ? '-' : `${signed(dN, 0)}명 (${signed(dP, 1)}%p)`}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {insight && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                        {insight.indicators.map((ind, i) => (
                                            <div key={i} className="rounded-2xl bg-white/10 border border-white/15 p-4">
                                                <p className="text-[10px] font-black tracking-wider text-indigo-200/80 leading-snug">{ind.label}</p>
                                                <p className="text-xl font-black mt-1 tracking-tight">{ind.value}</p>
                                                <p className="text-[11px] text-indigo-200/60 mt-1 font-bold">{ind.sub}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm font-bold mb-8">
                                    {subjCards.map(card => (
                                        <div key={card.key} className="bg-white/10 p-6 rounded-3xl border border-white/20 backdrop-blur-lg hover:bg-white/15 transition-all">
                                            <div className={`flex items-center gap-3 mb-4 ${card.color} font-black uppercase italic tracking-tighter border-b ${card.border} pb-2`}>
                                                <Icon name={card.icon} size={20} /> {card.title}
                                            </div>
                                            <p className="leading-relaxed font-medium opacity-90">{card.text}</p>
                                            {insight && insight.subj[card.key] && (
                                                <ul className="space-y-2 mt-4 pt-4 border-t border-white/10">
                                                    {insight.subj[card.key].map((t, i) => (
                                                        <li key={i} className="flex gap-2 text-[13px] leading-relaxed font-medium opacity-90">
                                                            <span className={`${card.color} font-black shrink-0`}>▸</span><span>{t}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {insight && (
                                    <div className="mb-8">
                                        <h4 className="text-xs font-black tracking-widest uppercase text-indigo-200 mb-3">대입 지원 전략 · 진학 지도 포인트</h4>
                                        <div className="space-y-3">
                                            {insight.admission.map((a, i) => (
                                                <div key={i} className="flex flex-col md:flex-row gap-3 rounded-2xl bg-white/5 border border-white/10 p-4">
                                                    <span className="shrink-0 self-start px-3 py-1 rounded-full bg-amber-400 text-indigo-950 text-xs font-black">{a.tag}</span>
                                                    <p className="text-[13px] leading-relaxed font-medium opacity-90">{a.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {insight && (
                                    <div className="mb-8">
                                        <h4 className="text-xs font-black tracking-widest uppercase text-indigo-200 mb-3">실행 로드맵</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {insight.roadmap.map((r, i) => (
                                                <div key={i} className="rounded-2xl bg-white/5 border border-white/10 p-4">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="w-6 h-6 rounded-full bg-emerald-400 text-indigo-950 text-xs font-black flex items-center justify-center">{i + 1}</span>
                                                        <span className="text-xs font-black text-emerald-300 tracking-wider">{r.when}</span>
                                                    </div>
                                                    <p className="text-[13px] leading-relaxed font-medium opacity-90">{r.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {insight && (
                                    <div className="border-l-4 border-amber-400 pl-5 py-1">
                                        <p className="text-[10px] font-black tracking-widest uppercase text-amber-300 mb-1">진학 전문교사 총평</p>
                                        <p className="text-sm leading-relaxed font-medium italic opacity-95">{insight.comment}</p>
                                    </div>
                                )}

                                <p className="mt-8 text-[10px] text-indigo-200/50 leading-relaxed font-bold italic">
                                    ※ 핵심 지표표는 학교 응시자 기준 등급 분포에서 자동 산출됩니다. 영역 합은 국·수·영·탐구(우수 1과목) 중 등급이 좋은 순으로 계산했습니다(고1: 원점수·등급컷, 고2: 교육청 분석 자료, 고3: 성적일람표). 고3 6·9월은 졸업생이 합류한 모의평가이므로 3월 학평과 등급의 의미가 다릅니다. 대학별 모집요강·수능최저는 매년 달라질 수 있으니 반드시 해당 연도 요강을 확인하십시오.
                                </p>
                            </div>
                        </section>
                    </main>

                    <footer className="mt-20 mb-10 text-center text-gray-500 text-[11px] font-bold tracking-[0.3em] uppercase opacity-60">
                        &copy; 2026 DAEJEON DAE SHIN HIGH SCHOOL · ACADEMIC INTELLIGENCE HUB · DATA CONSOLIDATED
                        <br />
                        <span className="mt-2 inline-block italic font-black text-gray-400 underline decoration-indigo-200 underline-offset-4 uppercase tracking-[0.1em]">Created by HA JIN SU</span>
                        <br />
                        <a href="https://claude.ai/artifact/R36yGUziP6PZdo5aC8X2V5" target="_blank" rel="noopener noreferrer" className="mt-3 inline-block font-black text-indigo-500 hover:text-indigo-700 underline decoration-indigo-200 underline-offset-4 tracking-[0.1em]">하진수 자료실 · 포트폴리오 바로가기</a>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
